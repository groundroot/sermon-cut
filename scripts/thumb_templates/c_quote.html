<!doctype html>
<!-- Thumbnail style C "Quote": darkened full-bleed photo, one line from the sermon/lyric as the headline,
     title and name small underneath. Filled by sermon_cut.py thumbset. 1280×720. -->
<html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #111; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
           object-position: {{fx}}% {{fy}}%; filter: saturate(.85) brightness(.62); }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.15) 62%); }
  .text { position: absolute; left: 72px; right: 72px; bottom: 64px; color: #fff; }
  .mark { font-family: "Nanum Myeongjo", serif; font-weight: 800; font-size: 120px; line-height: .6; color: #ffcf6e;
          height: 52px; }
  .quote { font-family: "Nanum Myeongjo", serif; font-weight: 800; font-size: 60px; line-height: 1.28;
           letter-spacing: -.03em; word-break: keep-all; max-width: 1060px; text-shadow: 0 3px 18px rgba(0,0,0,.5); }
  .quote em { font-style: normal; color: #ffcf6e; }
  .meta { margin-top: 26px; font-family: "Pretendard", sans-serif; font-weight: 600; font-size: 26px;
          color: rgba(255,255,255,.85); }
  .meta b { color: #fff; font-weight: 800; }
</style></head>
<body>
  <img class="photo" src="{{photo}}">
  <div class="shade"></div>
  <div class="text">
    <div class="mark">“</div>
    <div class="quote">{{quote}}</div>
    <div class="meta"><b>{{title}}</b> · {{name}} · {{eyebrow}}</div>
  </div>
</body></html>
